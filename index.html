<script>

const ic=(n,s=20)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';

/* ===== Google Sheet backend (Apps Script) ===== */
const API_URL="https://script.google.com/macros/s/AKfycbzL_Ujs7EIvpdcrFEXVDasLLEyI2MREaHAyzDqwBD5tCZrPsYp8wmiroYMmcMgI_7Wc/exec";
let LOCAL=false;
function makeLocalDB(){
  const K="md-local-db";let mem={};
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return mem}};
  const save=d=>{mem=d;try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
  const subs=new Set(),fire=()=>subs.forEach(f=>f());
  const rows=(col,wh)=>Object.entries(load()[col]||{}).filter(([i,d])=>!wh||d[wh[0]]===wh[1]).map(([id,data])=>({id,data:()=>data}));
  const put=(col,id,fn)=>{const d=load();d[col]=d[col]||{};d[col][id]=fn(d[col][id]);save(d);fire()};
  const doc=p=>{const i=p.indexOf("/"),col=p.slice(0,i),id=p.slice(i+1);return{
    get:async()=>{const v=(load()[col]||{})[id];return{id,exists:v!=null,data:()=>v}},
    set:async d=>put(col,id,()=>d),
    update:async d=>put(col,id,o=>Object.assign({},o,d))}};
  const query=(col,wh)=>({
    where:(f,op,v)=>query(col,[f,v]),
    add:async d=>put(col,"id"+Date.now()+Math.random().toString(36).slice(2,6),()=>d),
    onSnapshot:cb=>{const f=()=>cb({docs:rows(col,wh)});subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  const pubU=d=>d?{username:d.username,name:d.name,role:d.role}:null,acc=u=>(load().accounts||{})[u],rs=()=>Math.random().toString(36).slice(2);
  const auth={
    login:async(u,p)=>{const d=acc(u);if(!d||d.hash!==await sha(d.salt+p))throw new Error("BAD_LOGIN");return pubU(d)},
    signup:async(n,u,p)=>{if(acc(u))throw new Error("TAKEN");const salt=rs(),a={username:u,name:n,role:"emp",salt,hash:await sha(salt+p)};put("accounts",u,()=>a);return pubU(a)},
    changePw:async(u,c,n)=>{const d=acc(u);if(!d||d.hash!==await sha(d.salt+c))throw new Error("BAD_PW");const salt=rs(),hash=await sha(salt+n);put("accounts",u,o=>Object.assign({},o,{salt,hash}))},
    user:async u=>pubU(acc(u))};
  return{doc,collection:c=>query(c,null),auth};
}
async function seedLocal(){
  for(const [u,n,r,p] of [["md","MD Sir","md","md123"],["checker","Checker","checker","checker123"]]){
    if(!(await db.doc("accounts/"+u).get()).exists){const salt="demo";await db.doc("accounts/"+u).set({username:u,name:n,role:r,salt,hash:await sha(salt+p)})}
  }
}
const ticks=new Set();
const refreshAll=()=>ticks.forEach(f=>f());
async function call(o){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o),signal:c.signal}).finally(()=>clearTimeout(t));
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
function makeDB(){
  const w=async o=>{const j=await call(o);refreshAll();return j};
  const doc=p=>{const i=p.indexOf("/"),col=p.slice(0,i),id=p.slice(i+1);return{
    get:async()=>{const j=await call({op:"get",col,id});return{id,exists:j.data!=null,data:()=>j.data}},
    set:d=>w({op:"set",col,id,data:d}),
    update:d=>w({op:"update",col,id,data:d})}};
  const query=(col,wh)=>({
    where:(f,op,v)=>query(col,[f,v]),
    add:d=>w({op:"add",col,data:d}),
    onSnapshot:cb=>{
      let last=null,stop=false;
      const tick=async()=>{if(stop||document.hidden)return;
        try{const j=await call({op:"list",col,where:wh});const s=JSON.stringify(j.docs);
          if(s!==last){last=s;cb({docs:j.docs.map(d=>({id:d.id,data:()=>d.data}))})}}catch(e){}};
      ticks.add(tick);tick();const t=setInterval(tick,4000);
      return()=>{stop=true;clearInterval(t);ticks.delete(tick)};
    }});

    login:(u,p)=>call({op:"login",username:u,password:p}).then(j=>j.user),
    signup:(n,u,p)=>call({op:"signup",name:n,username:u,password:p}).then(j=>j.user),
    changePw:(u,c,n)=>call({op:"changePw",username:u,old:c,password:n}),
    user:u=>call({op:"user",username:u}).then(j=>j.user)};
  return{doc,collection:c=>query(c,null),auth};
}

async function submit(){
  if(FROM===null||TO===null)return info("Pick a time","Choose a start and end time first.");
  if(!PUR.trim())return info("Add a purpose","Write what the meeting is about.");
  if(busyAt(date,FROM))return info("MD sir is not available","Someone just booked this time. Please choose another.");
  const a={empUser:ME.username,empName:ME.name,date,start:FROM,end:TO,purpose:PUR.trim(),status:ME.role==="checker"?"forwarded":"new",empRole:ME.role,at:Date.now(),prev:PREV||null,urgent:URG};if(ME.role==="checker")a.fwdAt=Date.now();
  try{
    await db.collection("appts").add(a);
    if(ME.role==="checker")await notify(["md"],(URG?"URGENT: ":"")+ME.name+" (Checker) requested an appointment on "+fd(date)+", "+span(a)+" for your approval","forwarded");else await notify(["checker"],(URG?"URGENT: ":"")+ME.name+" requested an appointment on "+fd(date)+", "+span(a),"request");
    PUR="";PREV=null;URG=false;FROM=null;TO=null;tab="mine";
    ME.role==="checker"?info("Sent to MD sir","Your request has gone straight to MD sir for approval. You will be notified."):info("Request sent","Your checker will review it and send it to MD sir. You will be notified at every step.");
  }catch(e){info("Not sent","Could not send the request. Please try again.")}
  render();
}

}
function agenda(){
  const n=nowMin(),l=APPTS.filter(a=>a.date===today&&stOf(a)==="approved").sort((a,b)=>a.start-b.start),bl=BLOCKS.filter(b=>b.date===today);
  const nx=l.find(a=>a.end>n),lb=a=>{const d=a.start-n;return d<=0?"In progress until "+f12(a.end):"Next in "+(d>=60?Math.floor(d/60)+"h ":"")+(d%60)+"m"};
  let h='<div class="nxt"><small>Today\'s agenda</small><b style="display:block;font-size:21px;margin:2px 0">'+(nx?lb(nx):l.length?"All done for today":"No meetings today")+'</b>'+(nx?'<small>'+esc(nx.empName)+' &middot; '+span(nx)+' &middot; '+esc(nx.purpose)+'</small>':"")+'</div>';
  if(l.length||bl.length)h+='<div class="card">'+l.map(a=>'<div class="row" style="'+(a.end<=n?"opacity:.5":"")+'"><span><b>'+span(a)+'</b><br><small>'+esc(a.empName)+' &middot; '+esc(a.purpose)+'</small></span></div>').join("")+bl.map(b=>'<div class="row"><span><b>'+span(b)+'</b><br><small>Blocked'+(b.note?" &middot; "+esc(b.note):"")+'</small></span></div>').join("")+'</div>';
  return h;
}
function statsView(){
  const L=APPTS.filter(vis),c=s=>L.filter(a=>stOf(a)===s).length,ap=c("approved"),rj=c("rejected"),rt=c("returned"),pn=c("new")+c("forwarded"),dc=ap+rj,md=ME.role==="md";
  const bars=(arr,mx)=>arr.map(([n,v])=>'<div style="margin:9px 0"><div class="crow"><span class="grow">'+esc(n)+'</span><b>'+v+'</b></div><div style="height:8px;border-radius:6px;background:var(--busy)"><div style="height:8px;border-radius:6px;background:var(--acc);width:'+(mx?v/mx*100:0)+'%"></div></div></div>').join("");
  const by={};L.forEach(a=>by[a.empName]=(by[a.empName]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const wd=[0,0,0,0,0,0,0];L.forEach(a=>wd[D(a.date).getDay()]++);const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const st=(v,t)=>'<div><b>'+v+'</b><small>'+t+'</small></div>';
  let h='<div class="stat">'+st(L.length,"Requests")+st(dc?Math.round(ap/dc*100)+"%":"-","Approval rate")+st(pn,"Pending")+'</div>';
  h+='<div class="stat">'+st(ap,"Approved")+st(rj,"Rejected")+st(md?L.filter(a=>a.urgent).length:rt,md?"Urgent":"Returned")+'</div>';
  h+='<div class="panel"><h2>Who books the most</h2>'+(top.length?bars(top,top[0][1]):'<p class="sub">No data yet.</p>')+'</div>';
  h+='<div class="panel"><h2>Busiest days</h2>'+bars([0,1,2,3,4,6].map(i=>[dn[i],wd[i]]),Math.max(1,...wd))+'</div>';
  return h;
}
function bookView(){
  const st=starts();
  if(FROM===null||!st.includes(FROM))FROM=st.length?st[0]:null;
  const en=FROM===null?[]:ends(FROM);
  if(TO===null||!en.includes(TO))TO=en.length?en[0]:null;
  const day=APPTS.filter(a=>a.date===date&&BUSY.includes(stOf(a))).concat(BLOCKS.filter(b=>b.date===date)).sort((a,b)=>a.start-b.start);
  let h=BACK+'<div class="panel"><div class="step"><i>1</i><h2 style="margin:0">Choose a date</h2></div>'+dateBar()+'<p class="sub" style="margin-top:8px">'+fd(date)+" &middot; Office hours 10:00 AM - 5:30 PM</p><button class=\"btn out sm\" style=\"margin-top:10px\" onclick=\"nextFree()\">"+ic("bolt",18)+"Find next free slot</button></div>";
  h+='<div class="panel"><div class="step"><i>2</i><h2 style="margin:0">MD sir\'s availability</h2></div>'+tlHtml(day,FROM!==null&&TO!==null?[FROM,TO]:null)+"</div>";
  if(!st.length)return h+'<div class="panel empty">'+ic("clock",34)+"MD sir has no free time on this day. Please pick another date.</div>";
  h+='<div class="panel"><div class="step"><i>3</i><h2 style="margin:0">Time and purpose</h2></div><div class="two"><div><label style="margin-top:0">From</label><select onchange="setFrom(this.value)">'+st.map(m=>'<option value="'+m+'"'+(m===FROM?" selected":"")+">"+f12(m)+"</option>").join("")+'</select></div><div><label style="margin-top:0">To</label><select onchange="TO=+this.value;render()">'+en.map(m=>'<option value="'+m+'"'+(m===TO?" selected":"")+">"+f12(m)+"</option>").join("")+"</select></div></div>";
  h+='<label>Booking as</label><input value="'+esc(ME.name)+'" readonly><label>Purpose</label><textarea rows="3" oninput="PUR=this.value" placeholder="What is the meeting about?">'+esc(PUR)+'</textarea>';h+='<label style="display:flex;gap:10px;align-items:center;margin-top:12px;text-transform:none;font-size:14px"><input type="checkbox" style="width:20px;height:20px" '+(URG?"checked":"")+' onchange="URG=this.checked"> Mark as urgent</label>';
  h+='<div class="sum">'+ic("cal",24)+"<div><b>"+fd(date)+"</b><small>"+f12(FROM)+" - "+f12(TO)+" ("+(TO-FROM>=60?(TO-FROM)/60+" hr":(TO-FROM)+" min")+')</small></div></div><button class="btn" onclick="submit()">'+ic("send",18)+(ME.role==="checker"?"Send to MD for approval":"Send request to checker")+"</button></div>";
  return h;
}
function mineView(lim){
  const mine=APPTS.filter(a=>a.empUser===ME.username).sort((a,b)=>b.at-a.at).slice(0,lim||999);
  if(!mine.length)return'<div class="panel empty">'+ic("list",34)+"No requests yet. Tap Book appointment on Home to make your first one.</div>";
  return mine.map(a=>{const s=stOf(a);return'<div class="card"><div class="crow">'+dbadge(a.date)+'<div class="grow"><b>'+fdl(a.date)+' &middot; '+span(a)+'</b><small>'+esc(a.purpose)+'</small></div><span class="chip s-'+s+'">'+CHIP(a)+"</span></div>"+track(s)+(a.note?'<div class="msg"><b>Checker\'s note:</b> '+esc(a.note)+"</div>":"")+(s==="returned"||s==="rejected"||s==="cancelled"?'<button class="btn ghost sm" onclick="rebook(\''+a.id+'\')">'+ic("plus",18)+"Book again</button>":"")+"</div>"}).join("");
}
const GRP={pending:["new","forwarded"],approved:["approved"],cancelled:["cancelled","rejected","returned"]};
function mdBlockList(){
  if(ME.role!=="md")return"";
  const l=BLOCKS.filter(b=>b.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  return'<div class="sec"><h2>Blocked times</h2><span>'+l.length+'</span></div>'+(l.length?l.map(b=>'<div class="card" style="border-left:4px solid var(--mute)"><div class="crow">'+dbadge(b.date)+'<div class="grow"><b>'+span(b)+' &middot; Blocked</b><small>'+fdl(b.date)+(b.note?" &middot; "+esc(b.note):"")+'</small></div><button class="btn out sm" style="width:auto;padding:8px 14px;margin:0" onclick="unblock(\''+b.id+'\')">Remove</button></div></div>').join(""):'<div class="panel empty">'+ic("lock",34)+"No blocked times.</div>");
}
function apptView(){
  const base=APPTS.filter(a=>ME.role==="emp"?a.empUser===ME.username:ME.role==="md"?vis(a):true);
  const n=k=>base.filter(a=>GRP[k].includes(stOf(a))).length;
  const seg=[["pending","Pending"],["approved","Approved"],["cancelled","Cancelled"]];
  let h=(ME.role==="md"?'<button class="btn out sm" style="margin:0 0 12px" onclick="blockForm()">'+ic("plus",18)+"Block a time</button>":"")+'<div class="panel" style="padding:8px"><div class="seg" style="margin:0">'+seg.map(s=>'<button class="'+(AF===s[0]?"on":"")+'" onclick="AF=\''+s[0]+'\';render()">'+s[1]+" ("+n(s[0])+")</button>").join("")+"</div></div>";
  const l=base.filter(a=>GRP[AF].includes(stOf(a))).sort((a,b)=>AF==="cancelled"?b.date.localeCompare(a.date)||b.start-a.start:a.date.localeCompare(b.date)||a.start-b.start);
  h+=l.length?l.map(a=>'<button class="card" onclick="detail(\''+a.id+'\')"><div class="crow">'+dbadge(a.date)+'<div class="grow"><b>'+esc(a.empName)+UB(a)+'</b><small>'+fdl(a.date)+" &middot; "+span(a)+" &middot; "+esc(a.purpose)+'</small></div><span class="chip s-'+stOf(a)+'">'+CHIP(a)+"</span></div></button>").join(""):'<div class="panel empty">'+ic(AF==="approved"?"check":AF==="cancelled"?"x":"clock",34)+"No "+AF+" appointments.</div>";
  return h+mdBlockList();
}
const vis=a=>ME.role==="md"?(["forwarded","approved","rejected"].includes(stOf(a))||(stOf(a)==="cancelled"&&(a.fwdAt||a.empRole==="checker"))):true;
function homeView(){
  const md=ME.role==="md",want=md?"forwarded":"new";
  const q=APPTS.filter(a=>stOf(a)===want).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||a.date.localeCompare(b.date)||a.start-b.start);
  const act=APPTS.filter(a=>vis(a)&&["new","forwarded","approved"].includes(stOf(a))&&a.date>=today);
  const td=act.filter(a=>a.date===today).length,up=act.filter(a=>a.date>today).length;
  let h=(md?agenda():"")+'<div class="stat"><div><b>'+q.length+"</b><small>"+(md?"To approve":"To review")+"</small></div><div><b>"+td+"</b><small>Today</small></div><div><b>"+up+"</b><small>Upcoming</small></div></div>";
  h+='<div class="sec"><h2>'+(md?"Waiting for your approval":"Needs your action")+"</h2><span>"+q.length+"</span></div>";
  h+=q.length&&!md?chkQueue(q):q.length?q.map(a=>'<button class="card" onclick="detail(\''+a.id+'\')"><div class="crow">'+dbadge(a.date)+'<div class="grow"><b>'+esc(a.empName)+UB(a)+'</b><small>'+fdl(a.date)+" &middot; "+span(a)+" &middot; "+esc(a.purpose)+'</small></div><span style="color:var(--acc)">'+ic(md?"check":"send",20)+"</span></div></button>").join(""):'<div class="panel empty">'+ic("check",34)+"Nothing waiting. You are all caught up.</div>";
  const g={};act.sort((a,b)=>a.start-b.start).forEach(a=>(g[a.date]=g[a.date]||[]).push(a));
  const ds=Object.keys(g).sort();
  h+='<div class="sec"><h2>Appointments by date</h2><span>'+ds.length+" day"+(ds.length===1?"":"s")+"</span></div>";
  h+=ds.length?ds.map(s=>dateCard(s,g[s])).join(""):'<div class="panel empty">'+ic("cal",34)+"No upcoming appointments.</div>";
  return h;
}
const dayBlocks=()=>BLOCKS.filter(b=>b.date===date).sort((a,b)=>a.start-b.start);
function blockCards(){
  if(ME.role==="emp")return"";const md=ME.role==="md";
  return dayBlocks().map(b=>'<div class="card" style="border-left:4px solid var(--mute)"><div class="crow"><div class="ini" style="color:var(--mute)">'+ic("x",20)+'</div><div class="grow"><b>'+span(b)+' &middot; Blocked</b><small>'+(md?"Blocked by you":"Blocked by MD sir")+'</small></div>'+(md?'<button class="btn out sm" style="width:auto;padding:8px 14px" onclick="unblock(\''+b.id+'\')">Remove</button>':"")+'</div>'+(b.note?'<div class="msg"><b>Note:</b> '+esc(b.note)+'</div>':"")+'</div>').join("");
}
function blockForm(){
  const o=m=>'<option value="'+m+'">'+f12(m)+'</option>';
  modal('<h2>Block a time</h2><p class="sub">Employees will see this time as not available. Only you and the checker can see your note.</p><label>Date</label><input type="date" id="bd" min="'+today+'" value="'+(date<today?today:date)+'"><div class="two"><div><label>From</label><select id="bf">'+SL.map(o).join("")+'</select></div><div><label>To</label><select id="bt">'+SL.map(m=>m+30).map(o).join("")+'</select></div></div><label>Note (checker only)</label><textarea id="bn" rows="3" placeholder="e.g. Board meeting, personal work"></textarea><button class="btn" onclick="saveBlock()">Block this time</button><button class="btn ghost" onclick="closeModal()">Cancel</button>');
  document.getElementById("bt").selectedIndex=1;
}
async function saveBlock(){
  const d=document.getElementById("bd").value,f=+document.getElementById("bf").value,t=+document.getElementById("bt").value,n=document.getElementById("bn").value.trim();
  if(!d||d<today)return info("Pick a date","Choose today or a future date.");
  if(isFri(d))return info("Friday is off","Appointments are not taken on Fridays.");
  if(t<=f)return info("Check the time","The end time must be after the start time.");
  const clash=APPTS.some(a=>a.date===d&&BUSY.includes(stOf(a))&&a.start<t&&a.end>f)||BLOCKS.some(b=>b.date===d&&b.start<t&&b.end>f);
  if(clash)return info("Time already taken","There is already an appointment or block in this time. Choose another time.");
  try{await db.collection("blocks").add({date:d,start:f,end:t,note:n,at:Date.now()});closeModal();date=d;render()}
  catch(e){info("Not saved","Could not block this time. Please try again.")}
}
async function unblock(id){try{await db.doc("blocks/"+id).update({removed:true})}catch(e){info("Not removed","Please try again.")}}
function calView(){
  const day=APPTS.filter(a=>a.date===date&&vis(a)&&stOf(a)!=="returned").sort((a,b)=>a.start-b.start);
  return'<div class="panel">'+dateBar()+'<p class="sub" style="margin-top:8px">'+fd(date)+'</p>'+tlHtml(day.filter(a=>BUSY.includes(stOf(a))).concat(dayBlocks()),null)+(ME.role==="md"?'<button class="btn out sm" style="margin-top:12px" onclick="blockForm()">'+ic("plus",18)+"Block a time</button>":"")+"</div>"+blockCards()+(day.length?dateCard(date,day):'<div class="panel empty">'+ic("cal",34)+"Nothing booked for this day.</div>");
}
function peopleView(){
  if(!PEOPLE.length)return'<div class="panel empty">'+ic("users",34)+"No employees have signed up yet.</div>";
  return PEOPLE.map(p=>{const l=APPTS.filter(a=>a.empUser===p.username&&vis(a));return'<button class="card" onclick="person(\''+p.username+'\')"><div class="crow"><div class="ini">'+esc(p.name.slice(0,1).toUpperCase())+'</div><div class="grow"><b>'+esc(p.name)+'</b><small>@'+esc(p.username)+'</small></div><div style="text-align:right"><b>'+l.length+'</b><small>appointments</small></div></div></button>'}).join("");
}
function meView(){
  const f=(id,l,ph)=>'<label>'+l+'</label><div class="fi">'+ic("lock",18)+'<input id="'+id+'" type="password" autocomplete="'+(id==="pc"?"current-password":"new-password")+'"></div>';
  return'<div class="panel" style="text-align:center"><div class="ini big">'+esc(ME.name.slice(0,1).toUpperCase())+'</div><h2 style="margin-top:12px;font-size:19px">'+esc(ME.name)+'</h2><span class="chip s-forwarded">'+ROLE[ME.role]+'</span><p class="sub" style="margin-top:8px">@'+esc(ME.username)+"</p></div>"+
  (ME.role==="md"?declBtn():"")+'<div class="panel"><h2>Change password</h2><p class="sub">Use at least 6 characters.</p>'+f("pc","Current password")+f("pn","New password")+f("pr","Confirm new password")+(pwMsg?'<div class="msg '+(pwMsg.ok?"ok":"")+'">'+esc(pwMsg.text)+"</div>":"")+'<button class="btn" onclick="changePw()">'+ic("lock",18)+'Update password</button></div><button class="btn out" onclick="logout()">'+ic("out",18)+"Log out</button>";
}
function loginView(){
  const su=mode==="up",fi=(id,l,i,t,ac)=>'<label>'+l+'</label><div class="fi">'+ic(i,18)+'<input id="'+id+'" type="'+(t||"text")+'" autocapitalize="none" autocomplete="'+ac+'">'+(id==="p"?'<button class="eye" type="button" onclick="togglePw()" aria-label="Show password">'+ic("eye",18)+"</button>":"")+"</div>";
  return'<div class="lg"><div class="lgtop"><div class="logo">'+ic("cal",30)+'</div><h1>Timenest</h1><p>Book the right slot, effortlessly</p></div><div class="lgc"><div class="seg"><button class="'+(su?"":"on")+'" onclick="mode=\'in\';err=\'\';render()">Log in</button><button class="'+(su?"on":"")+'" onclick="mode=\'up\';err=\'\';render()">Sign up</button></div>'+(su?fi("n","Full name","user","text","name"):"")+fi("u","Username","mail","text","username")+fi("p","Password","lock","password",su?"new-password":"current-password")+(err?'<div class="err">'+esc(err)+"</div>":"")+'<button class="btn" onclick="'+(su?"register()":"login()")+'">'+(su?"Create employee account":"Log in")+'</button></div><p class="fine">Employees can sign up here. MD and Checker accounts are created by the admin.'+(LOCAL?'<br><br><b>OFFLINE MODE: server not reachable, data is saved on this device only'+(OFFREASON?' ('+esc(OFFREASON)+')':'')+'</b><br>MD: md / md123 &middot; Checker: checker / checker123':'')+'</p></div>';
}
function render(){
  const app=document.getElementById("app");
  if(!db){app.innerHTML='<div class="loadmsg">Connecting...</div>';return}
  if(!ME){app.innerHTML=loginView();return}
  const emp=ME.role==="emp",un=NOTES.filter(n=>!n.read).length;
  const qn=emp?0:APPTS.filter(a=>stOf(a)===(ME.role==="md"?"forwarded":"new")).length;
  const tabs=emp?[["home","home","Home"],["appt","list","Appointments"],["me","user","Profile"]]:ME.role==="checker"?[["home","home","Home"],["cal","cal","Schedule"],["appt","list","Appointments"],["stats","chart","Insights"],["me","user","Profile"]]:[["home","home","Home"],["cal","cal","Schedule"],["appt","list","Appts"],["stats","chart","Insights"],["people","users","People"],["me","user","Profile"]];
  const hr=new Date().getHours(),gr=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  const titles={book:"Book an appointment",mine:"My requests",appt:"Appointments",me:"Profile",home:gr+", "+ME.name.split(" ")[0],cal:"Schedule",people:"Employees",stats:"Insights"};
  let h='<div class="hero"><div class="hin"><div><small>'+(tab==="home"||tab==="book"?fd(today):ROLE[ME.role])+"</small><h1>"+esc(titles[tab])+'</h1></div><button class="ic" onclick="bellOpen()" aria-label="Notifications">'+ic("bell",21)+(un?"<b>"+un+"</b>":"")+'</button></div></div><main>';
  h+=({book:bookView,mine:mineView,home:emp?empHome:ME.role==="checker"?()=>ctaBtn()+homeView():homeView,cal:calView,stats:statsView,appt:apptView,people:peopleView,me:meView})[tab]();
  h+='</main><div class="nav"><div>'+tabs.map(t=>'<button class="'+((tab===t[0]||(tab==="book"&&t[0]==="home"))?"on":"")+'" onclick="tab=\''+t[0]+'\';pwMsg=null;render();window.scrollTo(0,0)">'+ic(t[1],22)+t[2]+(t[0]==="home"&&qn?"<b>"+qn+"</b>":"")+"</button>").join("")+"</div></div>";
  app.innerHTML=h;
}
(async()=>{
  if(!LOCAL){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"user",username:"md"}),signal:c.signal});clearTimeout(t);const j=await r.json();if(j.error&&!/NOT_FOUND/.test(j.error))throw new Error(j.error)}catch(e){LOCAL=true;OFFREASON=e.message||"no response"}}
  db=LOCAL?makeLocalDB():makeDB();if(LOCAL)await seedLocal();render();
  let u=null;try{u=localStorage.getItem(SK)}catch(e){}
  if(u){try{const a=await db.auth.user(u);if(a)return enter(a)}catch(e){}}
  render();
})();
</script>
